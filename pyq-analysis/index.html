7¹⁵",null,"27¹⁵","26¹⁵","26¹⁵","22a"],"effort":2,"tool":"gram","tip":"Five papers. Usually the 15-mark option.","count":5,"tier":1},{"unit":2,"name":"Greibach normal form","hits":["27¹⁵","22b","22b","22b","26¹⁵","26¹⁵"],"effort":3,"tool":"gram","tip":"In every paper, three times as an 8-marker and three as the 15-marker. The single best topic to master.","count":6,"tier":1},{"unit":2,"name":"Ambiguity of a grammar","hits":["22a",null,"22b",null,"22b",null],"effort":1,"tool":"gram","tip":"Show one string with two leftmost derivations or two parse trees.","count":3,"tier":2},{"unit":2,"name":"Write a CFG, derivations, parse trees","hits":["22b·27¹⁵","23b",null,null,"22a·26¹⁵",null],"effort":2,"tool":"gram","tip":"Leftmost derivation for a given string, then the parse tree.","count":3,"tier":2},{"unit":2,"name":"Properties of regular sets (closure)","hits":["22a",null,null,null,"22b",null],"effort":1,"tool":"plan","tip":"Union, concatenation, Kleene star, complement, intersection, reversal, each with one example.","count":2,"tier":3},{"unit":3,"name":"Design a PDA for a language","hits":["23a","23a·23b","23a·23b",null,"23a","23b"],"effort":2,"tool":"pda","tip":"Equal a and b, aⁿbⁿcᵐdᵐ, a^(m+n)bᵐcⁿ. Give the δ table and trace one string.","count":5,"tier":1},{"unit":3,"name":"CFG to PDA and trace a string","hits":["23b","23b","23a",null,"23b","23a"],"effort":1,"tool":"pda","tip":"Two moves only: expand a variable, match a terminal. The same grammar (010⁴) was asked twice.","count":5,"tier":1},{"unit":3,"name":"PDA to CFG","hits":[null,null,"23b","23a",null,null],"effort":3,"tool":"pda","tip":"Triple construction [p X q]. Lower priority.","count":2,"tier":3},{"unit":4,"name":"Any Turing machine construction (8 or 15 marks)","hits":["24a·24b","24a·27¹⁵","24a·24b","24a·24b·27¹⁵","24b·27¹⁵","24b·27¹⁵"],"effort":3,"tool":"tm","tip":"Every paper has a TM design option in Unit 4, and four of six also put one in Part C.","count":6,"tier":1},{"unit":4,"name":"TM unary arithmetic , then its closure. Add any new subset to the table.","A subset is final if it holds a final NFA state. Keep ∅ as a dead state if it appears.","Rename the subsets, draw the DFA, and test the strings from the question on both machines."]},{"name":"Mealy and Moore (8 marks)","steps":["State the difference in one line: Mealy output is on the transition, Moore output is on the state, and Moore output is one symbol longer.","Moore to Mealy: output of a transition is the output of its target state.","Mealy to Moore: split each state q into (q, o), one copy per output that arrives at q.","Add a start state with a chosen initial output if the start state has incoming edges with different outputs.","Run one input through both machines to show they agree."]},{"name":"Minimize a DFA (8 marks)","steps":["Remove states unreachable from the start.","List all pairs. Mark every (final, non-final) pair in round 0.","Repeat: mark (p, q) if some symbol takes them to a marked pair.","Unmarked pairs are equivalent. Merge them into classes.","Draw the minimized DFA and compare the state count."]},{"name":"Simplify, CNF (8 or 15 marks)","steps":["ε-productions: find nullable variables, add every version of each rule with them dropped, delete A→ε.","Unit productions: for each unit pair (A, B) copy B’s non-unit rules to A, delete A→B.","Useless symbols: delete non-generating variables, then unreachable ones.","CNF: replace terminals inside longer rules by new variables Cₐ → a.","CNF: break rules longer than two symbols with new variables D₁, D₂, …","Show the final grammar and confirm every rule is A→BC or A→a."]},{"name":"Greibach normal form (8 or 15 marks)","steps":["Simplify first (no ε, no unit rules, no useless symbols). Going through CNF first is allowed and usually safer.","Number the variables A₁ … Aₘ.","For i = 1 to m: substitute any rule Aᵢ → Aⱼγ with j < i, then remove left recursion Aᵢ → Aᵢα by adding Zᵢ.","After this pass every rule starts with a terminal or a higher-numbered variable.","Back-substitute from Aₘ up to A₁, then substitute into the Zᵢ rules.","Replace terminals that are not first by variables Cₐ → a. State the final grammar."]},{"name":"PDA design (8 marks)","steps":["Say the idea in two lines: what you push, what you pop, when you switch phase.","Give the 7-tuple, then the δ table (one line per move).","State the acceptance mode (final state or empty stack) and stick to it.","Trace one accepted string with instantaneous descriptions (q, input left, stack).","Trace one rejected string and say why it fails."]},{"name":"CFG to PDA (8 marks)","steps":["Use one working state. Push S above Z₀ to start.","For each rule A → α add δ(q, ε, A) = (q, α).","For each terminal a add δ(q, a, a) = (q, ε).","Add δ(q, ε, Z₀) = (qf, Z₀) to accept.","Trace the given string, choosing the rule that matches the next input symbol at each step."]},{"name":"Turing machine (8 or 15 marks)","steps":["Write the idea as 3 to 5 plain sentences (mark, scan right, return, repeat, verify).","List the tape alphabet and what each marker means.","Give the transition table or diagram.","Trace the sample string from the question step by step with instantaneous descriptions.","State when the machine accepts and what it does on a wrong string."]},{"name":"PCP instance (8 marks)","steps":["Write the tiles as a table (top over bottom).","Pick a first tile whose top and bottom agree as prefixes.","Track the overhang after each tile. Extend only with tiles that keep the two strings consistent.","Stop when the overhang is empty and give the index sequence with both strings written out.","If every tile has a longer top than bottom (or the reverse), say that no sequence can ever balance them.","Close with one line: PCP is undecidable in general, so no algorithm decides every instance."]}],"repeats":[{"what":"NFA where the second-last symbol is 1, convert to DFA, test 100010 and 100000","where":"Nov 2024 Q21a and Jul 2025 P2 Q21b (word for word)"},{"what":"Grammar S→0BB, B→0S|1S|0 converted to a PDA, test 010⁴","where":"Nov 2024 Q23b and Jul 2025 P1 Q23a(ii)"},{"what":"PDA for aⁿbⁿcᵐdᵐ","where":"Jul 2025 P1 Q23b and May 2026 Q23b"},{"what":"NPDA for an equal number of a and b","where":"Jul 2025 P1 Q23a(i) and Nov 2025 Q23a (trace baab)"},{"what":"TM for aⁿbⁿcⁿ","where":"Nov 2024 Q24a and Nov 2025 Q24b"},{"what":"TM unary addition","where":"Nov 2024 Q24b and Jul 2025 P2 Q24b"},{"what":"TM for unary multiplication (15 marks)","where":"May 2025 Q27 and Nov 2025 Q27"},{"what":"TM for w wᴿ","where":"Jul 2025 P1 Q24b and Jul 2025 P2 Q27"},{"what":"Rice theorem","where":"Nov 2024 Q25b and Jul 2025 P1 Q25a"},{"what":"CFG S→aS|bS|a|b equals (a+b)(a+b)*","where":"Jul 2025 P1 Q9 and May 2026 Q6 (MCQ)"},{"what":"Z₀ is the initial stack symbol","where":"Nov 2024 Q12, May 2025 Q9, May 2026 Q12 (MCQ)"}],"watch":["Nov 2024 Q23a(ii) asks for a PDA for aⁿbⁿc²ⁿ as printed. That language is not context-free (three counts tied together), so no PDA exists. Skip that option, or say so and prove it with the CFL pumping lemma.","Jul 2025 P1 Q12 lists two languages that PDAs cannot accept (aⁿbᵐcⁿdᵐ and aⁿbⁿcⁿ). Both are non-CFL, so the question has two correct answers. Do not lose time on it.","May 2026 Q25b (M = ab, bab, bbaaa; N = a, ba, bab) has no PCP solution because every top string is longer than its bottom string. Say that one sentence and you have the answer.","Several scans were hard to read. The PCP lists for Nov 2025 and the CFG in Jul 2025 P1 Q22b(i) are my best reading, so check them against your paper before trusting the sample answers."],"slots":[{"unit":1,"title":"Q21 · Finite automata (8 marks)","cover":["NFA to DFA","Mealy / Moore","Design or minimize a DFA"],"why":"In all six papers at least one of the two options is one of these three. Nov 2025 is covered only by the DFA design option (the other was a pumping-lemma proof)."},{"unit":2,"title":"Q22 · Grammars (8 marks)","cover":["Greibach normal form","Simplify + CNF","Ambiguity"],"why":"Four papers offered GNF, CNF or simplification here. Nov 2024 and Nov 2025 did not, and both offered ambiguity instead."},{"unit":3,"title":"Q23 · Pushdown automata (8 marks)","cover":["Design a PDA","CFG to PDA","PDA to CFG"],"why":"Jul 2025 P2 is the only paper without a design or CFG→PDA option, and it asked PDA→CFG."},{"unit":4,"title":"Q24 · Turing machines (8 marks)","cover":["aⁿbⁿcⁿ / 0ⁿ1ⁿ","Unary add / subtract","ww / wwᴿ","TM variants notes"],"why":"Short notes on TM variants, the universal TM or recursive/RE languages replaced one option in three papers (May 2025, Nov 2025, May 2026), so a half page of notes is cheap insurance next to the designs."},{"unit":5,"title":"Q25 · Undecidability (8 marks)","cover":["PCP / MPCP","Rice + Lₑ","Decidable vs undecidable"],"why":"PCP appears in five papers. Nov 2024 is the exception, and it asked Rice and P/NP."},{"unit":0,"title":"Q26 / Q27 · Part C (15 marks, pick one)","cover":["CNF then GNF","A TM design (multiply, copy, ww)","DFA to RE + pumping lemma"],"why":"A normal-form conversion was one of the two choices in five papers, and a TM design in four. Between them every paper is covered."}],"facts":{"closure":{"cols":["Union","Concat.","Star","Intersection","Complement"],"rows":[["Regular",1,1,1,1,1],["Context free",1,1,1,0,0],["Recursive",1,1,1,1,1],["Recursively enumerable",1,1,1,1,0]]},"hierarchy":[["Type 3","Regular grammar","Finite automaton"],["Type 2","Context-free grammar","Pushdown automaton"],["Type 1","Context-sensitive grammar","Linear bounded automaton"],["Type 0","Unrestricted grammar","Turing machine"]],"oneLiners":[["Z₀","initial (bottom) stack symbol"],["TM halting states","accept and reject"],["MPCP","the sequence must start with tile 1"],["UTM","simulates any TM given its description and input"],["NTM vs DTM","same power"],["NPDA vs DPDA","NPDA is more powerful"],["NFA vs ε-NFA vs DFA","same power"],["SAT","NP-complete"],["L and L̄ both RE","L is recursive"],["CNF rule shape","A → BC or A → a"],["GNF rule shape","A → aα, α a string of variables"],["Pumping lemma regular","proves a language is NOT regular"]]}}

 const ph=[['Phase 1 · Must-do',T.filter(t=>t.count>=5),'Learn these first. Five or six papers each.'],['Phase 2 · High',T.filter(t=>t.count===4),'Four papers each.'],['Phase 3 · Medium',T.filter(t=>t.count===3),'Three papers each.'],['Phase 4 · Bonus',T.filter(t=>t.count<=2),'Only if you have time.']];
 let h=`<section class="hero"><h2>Study plan</h2><p class="lead">Tick a topic when you can do it without looking. The meter shows how much of Part B that covers.</p><div id="meter"></div></section>`;
 ph.forEach(([n,ts,d],pi)=>{const min=ts.reduce((a,t)=>a+EST[t.effort],0);h+=`<section><h3>${n}</h3><p class="muted">${d} About ${Math.round(min/60*10)/10} hours in total.</p>`+ts.sort((a,b)=>a.unit-b.unit).map(t=>`<label class="task ${done.has(t.id)?'done':''}"><input type="checkbox" data-id="${t.id}" ${done.has(t.id)?'checked':''}><span>${esc(t.name)}<small>${UNAME[t.unit]} · ${t.count}/6 papers · about ${EST[t.effort]} min</small></span></label>`).join('')+'</section>'});
 h+=`<section><h3>Alongside</h3><ul class="trap"><li>Go through the MCQ bank once per unit (10 minutes each). Star anything you got wrong.</li><li>Do one Part C practice: a CNF then GNF conversion and a Turing machine.</li><li>Write out the three repeated 8-markers from the Overview by hand.</li><li>Last hour: read the Part A concepts page and the starred MCQs.</li></ul></section>`;
 $('#view').innerHTML=h;
 const meter=()=>{const c=coverage(done);$('#meter').innerHTML=covBar('Part B slots covered by your ticked topics',c.ok,c.tot,'c1')+`<p class="muted">Part C covered in ${c.c} of 6 papers.</p>`};meter();
 $$('.task input').forEach(i=>i.onchange=()=>{const id=+i.dataset.id;if(i.checked)done.add(id);else done.delete(id);store.set('fla.done',[...done]);i.closest('.task').classList.toggle('done',i.checked);meter()})}
// ------- shell
function stat(n,l){return `<div class="stat"><b>${n}</b><span>${l}</span></div>`}
const nRepeats=D.repeats.length;
app.innerHTML=`<header class="top"><h1>FLA 21CSC301T · Past paper analysis</h1><p>Six papers, Nov 2024 to May 2026. What was asked, what repeats, and what to study first.</p><div class="stats">${stat(6,'papers analysed')}${stat(30,'Part B slots mapped')}${stat(T.length,'topics')}${stat(nRepeats,'repeated questions')}${stat(MCQ.length,'MCQs with answers')}</div></header>${nav()}<main id="view"></main><footer>Answers to the MCQs are worked out from theory, not from an official key. Check the flagged ones against your notes. Scans were hard to read in places.</footer>`;
addEventListener('hashchange',route);route();

</script></body></html>
