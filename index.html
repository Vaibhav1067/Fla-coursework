<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLA Exam Playbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* Plan: a drafting-sheet playbook. Cool paper, one teal accent, mono for anything a machine reads.
     Layout: sticky tab rail over a single 1100px column of dense tables and lab panels. */
  --paper: #edf1f0; --card: #ffffff; --ink: #13201e; --ink-2: #3a4b48; --muted: #596b68;
  --line: #d2dbd8; --line-2: #e5ebe9; --accent: #0b7a6a; --accent-ink: #ffffff; --accent-soft: #d6eee8;
  --warn: #8f5206; --warn-soft: #fbefd8; --bad: #b42318; --bad-soft: #fde5e2; --good: #17703f; --good-soft: #dcf3e4;
  --grid: rgba(19, 32, 30, .045);
  --display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --body: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0c1413; --card: #132120; --ink: #e6f0ee; --ink-2: #bdd0cc; --muted: #94aaa6;
    --line: #28423f; --line-2: #1d3230; --accent: #46cbb2; --accent-ink: #062019; --accent-soft: #15423b;
    --warn: #f0b45a; --warn-soft: #3a2a0f; --bad: #ff8c80; --bad-soft: #43201c; --good: #6fd89a; --good-soft: #14392a;
    --grid: rgba(230, 240, 238, .05); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0c1413; --card: #132120; --ink: #e6f0ee; --ink-2: #bdd0cc; --muted: #94aaa6;
  --line: #28423f; --line-2: #1d3230; --accent: #46cbb2; --accent-ink: #062019; --accent-soft: #15423b;
  --warn: #f0b45a; --warn-soft: #3a2a0f; --bad: #ff8c80; --bad-soft: #43201c; --good: #6fd89a; --good-soft: #14392a;
  --grid: rgba(230, 240, 238, .05); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 400 15px/1.55 var(--body);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 28px 28px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: clamp(28px, 4.6vw, 44px); font-weight: 700; }
h2 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
h3 { font-size: 16px; font-weight: 600; }
p { margin: 0 0 10px; max-width: 70ch; }
a { color: var(--accent); }
code, pre, textarea, .mono { font-family: var(--mono); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

.rail { position: sticky; top: 0; z-index: 10; background: var(--card); border-bottom: 1px solid var(--line); }
.rail-in { max-width: 1100px; margin: 0 auto; padding: 0 16px; display: flex; align-items: center; gap: 14px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 17px; white-space: nowrap; display: flex; gap: 8px; align-items: baseline; }
.brand b { color: var(--accent); font-family: var(--mono); font-weight: 500; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: thin; flex: 1; }
.tabs a { padding: 12px 12px; text-decoration: none; color: var(--muted); font-weight: 500; white-space: nowrap; border-bottom: 3px solid transparent; font-size: 14px; }
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
main { max-width: 1100px; margin: 0 auto; padding: 22px 16px 80px; }
.view > * + * { margin-top: 22px; }

.hero { display: grid; gap: 14px; }
.eyebrow { font: 500 12px/1 var(--mono); color: var(--accent); letter-spacing: .06em; text-transform: uppercase; }
.lede { font-size: 17px; color: var(--ink-2); max-width: 62ch; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 2px; }
.stat .big { font: 700 34px/1 var(--display); color: var(--accent); font-variant-numeric: tabular-nums; }
.stat .big small { font-size: 16px; color: var(--muted); font-weight: 500; }
.stat span { color: var(--ink-2); font-size: 14px; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
.card > h2 + p, .card > h3 + p { color: var(--ink-2); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.blueprint { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.bp { border-left: 4px solid var(--accent); padding: 6px 0 6px 12px; }
.bp b { font-family: var(--mono); font-size: 13px; display: block; }
.bp span { font-size: 14px; color: var(--ink-2); }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--card); }
.seg button { border: 0; background: transparent; padding: 7px 12px; font: 500 13px var(--body); color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
button.btn, .btn { border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 7px 13px; border-radius: 8px; font: 500 14px var(--body); cursor: pointer; }
button.btn:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:disabled { opacity: .5; cursor: not-allowed; }
select, input[type=text], textarea { font: 400 14px var(--mono); color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; max-width: 100%; }
textarea { width: 100%; min-height: 150px; line-height: 1.5; resize: vertical; tab-size: 2; }
input[type=range] { accent-color: var(--accent); }
label { font-size: 13px; color: var(--muted); font-weight: 500; }
.field { display: grid; gap: 4px; }

.scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line-2); vertical-align: top; }
th { font: 600 12.5px var(--body); color: var(--muted); letter-spacing: .01em; background: var(--card); white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: center; font-variant-numeric: tabular-nums; }
.mono-cell { font-family: var(--mono); font-size: 13px; }

.heat th.paper { text-align: center; min-width: 74px; }
.heat td.hc { text-align: center; font: 500 12px var(--mono); padding: 6px 4px; min-width: 74px; }
.heat td.hit { background: var(--accent-soft); color: var(--ink); box-shadow: inset 0 0 0 1px var(--accent); }
.heat td.hit15 { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.heat td.miss { color: var(--line); }
.heat tr.unit th { background: var(--paper); color: var(--ink); text-transform: none; font: 600 13px var(--display); letter-spacing: 0; padding: 8px 10px; }
.heat td.topic { min-width: 230px; }
.heat td.topic small { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.4; margin-top: 2px; }
.seen { display: inline-flex; gap: 2px; margin-right: 6px; vertical-align: middle; }
.seen i { width: 7px; height: 14px; background: var(--line); border-radius: 2px; }
.seen i.on { background: var(--accent); }
.badge { display: inline-block; font: 600 11px var(--mono); padding: 3px 7px; border-radius: 5px; letter-spacing: .03em; white-space: nowrap; }
.badge.t1 { background: var(--accent); color: var(--accent-ink); }
.badge.t2 { border: 1px solid var(--accent); color: var(--accent); }
.badge.t3 { border: 1px dashed var(--muted); color: var(--muted); }
.dots { font-family: var(--mono); letter-spacing: 2px; color: var(--accent); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--ink-2); align-items: center; }
.legend i { display: inline-block; width: 26px; height: 14px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; }
.lg8 { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.lg15 { background: var(--accent); }

.slot { display: grid; gap: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--accent-soft); color: var(--ink); border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 500; }
.note { border-left: 4px solid var(--warn); background: var(--warn-soft); padding: 10px 14px; border-radius: 0 8px 8px 0; font-size: 14px; }
.note + .note { margin-top: 8px; }
.ok { color: var(--good); font-weight: 600; }
.no { color: var(--bad); font-weight: 600; }
.pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font: 600 12px var(--mono); }
.pill.ok { background: var(--good-soft); color: var(--good); }
.pill.no { background: var(--bad-soft); color: var(--bad); }
.pill.run { background: var(--warn-soft); color: var(--warn); }

details { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 0; }
details + details { margin-top: 8px; }
summary { cursor: pointer; padding: 11px 16px; font: 600 15px var(--display); list-style: none; display: flex; justify-content: space-between; gap: 10px; }
summary::-webkit-details-marker { display: none; }
summary::after { content: '+'; font-family: var(--mono); color: var(--accent); }
details[open] > summary::after { content: '–'; }
details > .body { padding: 0 16px 14px; }
details ol, details ul, .body ol, .body ul { margin: 0; padding-left: 20px; }
li + li { margin-top: 4px; }

.block { display: grid; gap: 8px; }
.block header { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.block .num { font: 700 26px var(--display); color: var(--accent); min-width: 28px; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; }
.check input { margin-top: 4px; accent-color: var(--accent); width: 16px; height: 16px; }
.check span.done { text-decoration: line-through; color: var(--muted); }
.progress { height: 8px; background: var(--line-2); border-radius: 99px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s; }

.lab { display: grid; gap: 14px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
pre { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 0; overflow-x: auto; font-size: 13.5px; line-height: 1.55; white-space: pre; }
.stage { border: 1px solid var(--line); border-radius: 10px; background: var(--card); overflow: hidden; }
.stage > h3 { padding: 9px 14px; background: var(--paper); border-bottom: 1px solid var(--line); font-size: 14px; }
.stage > .in { padding: 10px 14px; display: grid; gap: 8px; }
.err { background: var(--bad-soft); color: var(--bad); border-radius: 8px; padding: 9px 12px; font-size: 14px; }
svg.graph { width: 100%; max-width: 760px; height: auto; display: block; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
.g-edge { fill: none; stroke: var(--ink-2); stroke-width: 1.4; }
.g-node { fill: var(--card); stroke: var(--ink); stroke-width: 1.6; }
.g-node.active { fill: var(--accent); }
.g-inner { fill: none; stroke: var(--ink); stroke-width: 1.2; }
.g-label { font: 500 12px var(--mono); fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
.g-label.active { fill: var(--accent-ink); }
.g-el { font: 500 11.5px var(--mono); fill: var(--ink); text-anchor: middle; dominant-baseline: central; paint-order: stroke; stroke: var(--card); stroke-width: 4px; stroke-linejoin: round; }
.g-arrow { fill: var(--ink-2); }

.tape { display: flex; gap: 0; overflow-x: auto; padding: 22px 8px 8px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
.cell { width: 38px; min-width: 38px; height: 42px; border: 1.5px solid var(--ink-2); margin-left: -1.5px; display: grid; place-items: center; font: 600 17px var(--mono); position: relative; background: var(--card); }
.cell.blank { color: var(--line); }
.cell.head { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); z-index: 1; }
.cell.head::before { content: '▼'; position: absolute; top: -17px; left: 50%; transform: translateX(-50%); color: var(--accent); font-size: 12px; }
.statebox { font: 600 15px var(--mono); background: var(--accent-soft); padding: 4px 10px; border-radius: 6px; }
.ids { max-height: 240px; overflow: auto; font-size: 13px; }
.ids div { padding: 1px 0; white-space: pre; }
.ids div.cur { background: var(--accent-soft); }
.explain { font-size: 13px; color: var(--muted); font-family: var(--mono); min-height: 20px; }

.pairs td { text-align: center; font: 500 13px var(--mono); min-width: 40px; }
.pairs td.mk { background: var(--bad-soft); color: var(--bad); }
.pairs td.eq { background: var(--good-soft); color: var(--good); }
.pairs td.nil { background: var(--paper); }
.pairs th { text-transform: none; font: 600 13px var(--mono); letter-spacing: 0; }

.qbox { display: grid; gap: 12px; max-width: 760px; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; border: 1.5px solid var(--line); background: var(--card); padding: 10px 14px; border-radius: 8px; font: 400 15px var(--body); cursor: pointer; color: var(--ink); }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt:disabled { cursor: default; opacity: 1; }
.src { font: 500 12px var(--mono); color: var(--muted); }
.meter { display: grid; gap: 6px; }
.meter div.r { display: grid; grid-template-columns: 70px 1fr 50px; gap: 8px; align-items: center; font-size: 13px; }
.meter .bar { height: 10px; background: var(--line-2); border-radius: 99px; overflow: hidden; }
.meter .bar i { display: block; height: 100%; background: var(--accent); }

footer.src-note { margin-top: 34px; color: var(--muted); font-size: 13px; }
@media (max-width: 640px) {
  .brand span { display: none; }
  h2 { font-size: 20px; }
  .cell { width: 34px; min-width: 34px; height: 38px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

</style>
</head>
<body>
<header class="rail"><div class="rail-in"><div class="brand"><b>δ</b> FLA <span>playbook</span></div><nav class="tabs" id="tabs" aria-label="Sections"></nav></div></header>
<main id="view"></main>
<script>
/* FLA engines: finite automata, Mealy/Moore, grammars, PDA, TM, PCP. Pure functions, no DOM. */
(function (root) {
'use strict';
const EPS = 'ε';
const isEps = t => t === 'ε' || t === 'eps' || t === 'epsilon' || t === 'λ' || t === '~';
const uniq = a => [...new Set(a)];
const clone = o => JSON.parse(JSON.stringify(o));

/* ===================== Finite automata ===================== */
const KEY = '\u0001';
function parseTargets(str) {
  str = str.replace(/[{}]/g, ' ').replace(/,/g, ' ').trim();
  if (!str) return [];
  return uniq(str.split(/\s+/).filter(t => t && !/^(-|—|∅|phi|φ|none)$/i.test(t)));
}
function parseFA(text) {
  const fa = { start: null, finals: [], trans: {}, states: [], alphabet: [], hasEps: false };
  const seen = new Set();
  const addState = s => { if (!seen.has(s)) { seen.add(s); fa.states.push(s); } };
  for (const raw of text.split(/\n/)) {
    const line = raw.replace(/#.*$/, '').trim();
    if (!line) continue;
    let m;
    if ((m = line.match(/^start\s*[:=]\s*(.+)$/i))) { fa.start = m[1].trim().replace(/[{}]/g, ''); addState(fa.start); continue; }
    if ((m = line.match(/^(final|finals|accept|accepting)\s*[:=]\s*(.*)$/i))) { fa.finals = parseTargets(m[2]); fa.finals.forEach(addState); continue; }
    m = line.match(/^(\S+?)\s*[, ]\s*(\S+)\s*(?:->|→|=)\s*(.*)$/);
    if (!m) throw new Error('Cannot read: "' + raw.trim() + '". Write transitions like:  p 0 -> q r');
    const s = m[1];
    let a = m[2];
    if (isEps(a)) { a = EPS; fa.hasEps = true; } else if (!fa.alphabet.includes(a)) fa.alphabet.push(a);
    const t = parseTargets(m[3]);
    addState(s); t.forEach(addState);
    const k = s + KEY + a;
    fa.trans[k] = uniq((fa.trans[k] || []).concat(t));
  }
  if (!fa.states.length) throw new Error('Add at least one transition.');
  if (!fa.start) fa.start = fa.states[0];
  return fa;
}
const delta = (fa, s, a) => fa.trans[s + KEY + a] || [];
function epsClosure(fa, set) {
  const out = new Set(set), st = [...set];
  while (st.length) {
    const s = st.pop();
    for (const t of delta(fa, s, EPS)) if (!out.has(t)) { out.add(t); st.push(t); }
  }
  return [...out];
}
function nfaToDfa(fa) {
  const idx = s => fa.states.indexOf(s);
  const norm = arr => uniq(arr).sort((x, y) => idx(x) - idx(y));
  const nameOf = set => set.length ? '{' + set.join(',') + '}' : '∅';
  const closures = {};
  if (fa.hasEps) fa.states.forEach(s => { closures[s] = norm(epsClosure(fa, [s])); });
  const start = norm(epsClosure(fa, [fa.start]));
  const seen = new Map([[nameOf(start), start]]);
  const queue = [start], rows = [];
  while (queue.length) {
    const S = queue.shift();
    for (const a of fa.alphabet) {
      const move = norm([].concat(...S.map(s => delta(fa, s, a))));
      const to = norm(epsClosure(fa, move));
      rows.push({ from: S, sym: a, move, to });
      const n = nameOf(to);
      if (!seen.has(n)) { seen.set(n, to); queue.push(to); }
    }
  }
  const states = [...seen.entries()].map(([name, set]) => ({ name, set, final: set.some(s => fa.finals.includes(s)) }));
  const dfa = { states: states.map(s => s.name), alphabet: fa.alphabet.slice(), start: nameOf(start), finals: states.filter(s => s.final).map(s => s.name), delta: {} };
  for (const r of rows) { (dfa.delta[nameOf(r.from)] = dfa.delta[nameOf(r.from)] || {})[r.sym] = nameOf(r.to); }
  return { closures, startSet: start, rows, states, dfa, nameOf };
}
function runNFA(fa, w) {
  let cur = epsClosure(fa, [fa.start]);
  const trace = [cur.slice()];
  for (const c of w) {
    const next = [];
    for (const s of cur) next.push(...delta(fa, s, c));
    cur = uniq(epsClosure(fa, next));
    trace.push(cur.slice());
  }
  return { accepted: cur.some(s => fa.finals.includes(s)), trace };
}
function faToDfaObj(fa) {
  const d = { states: fa.states.slice(), alphabet: fa.alphabet.slice(), start: fa.start, finals: fa.finals.slice(), delta: {} };
  let trap = false;
  for (const s of fa.states) for (const a of fa.alphabet) {
    const t = delta(fa, s, a);
    if (t.length > 1) throw new Error('State ' + s + ' on ' + a + ' has several targets, so this is an NFA. Use the NFA to DFA converter.');
    (d.delta[s] = d.delta[s] || {})[a] = t.length ? t[0] : null;
  }
  return d;
}
function completeDfa(d) {
  d = clone(d);
  let needs = false;
  for (const s of d.states) for (const a of d.alphabet) if (!d.delta[s][a]) needs = true;
  if (needs) {
    let trap = 'dead'; while (d.states.includes(trap)) trap += "'";
    d.states.push(trap); d.delta[trap] = {};
    for (const a of d.alphabet) d.delta[trap][a] = trap;
    for (const s of d.states) for (const a of d.alphabet) if (!d.delta[s][a]) d.delta[s][a] = trap;
    d.trap = trap;
  }
  return d;
}
function runDFA(d, w) {
  let s = d.start; const path = [s];
  for (const c of w) {
    const t = d.delta[s] && d.delta[s][c];
    if (!t) return { accepted: false, path, stuck: true };
    s = t; path.push(s);
  }
  return { accepted: d.finals.includes(s), path };
}
function minimizeDFA(d0) {
  const d = completeDfa(d0);
  // reachable
  const reach = [d.start], seen = new Set(reach);
  for (let i = 0; i < reach.length; i++) for (const a of d.alphabet) { const t = d.delta[reach[i]][a]; if (!seen.has(t)) { seen.add(t); reach.push(t); } }
  const R = d.states.filter(s => seen.has(s));
  const removed = d.states.filter(s => !seen.has(s));
  const fin = s => d.finals.includes(s);
  const pk = (p, q) => R.indexOf(p) < R.indexOf(q) ? p + '|' + q : q + '|' + p;
  const marks = new Map(); // key -> {round, reason}
  const pairs = [];

    h('div', { class: 'row' }, h('button', { class: 'btn', type: 'button', onclick: () => { stop(); idx = 0; draw(); } }, '⏮ Reset'), h('button', { class: 'btn', type: 'button', onclick: () => { stop(); if (idx > 0) { idx--; draw(); } } }, '◀ Back'), h('button', { class: 'btn primary', type: 'button', onclick: () => { stop(); if (idx < cfgs.length - 1) { idx++; draw(); } } }, 'Step ▶'), h('button', { class: 'btn', type: 'button', onclick: play }, '▶ Play'), h('button', { class: 'btn', type: 'button', onclick: stop }, '⏸ Pause'), h('button', { class: 'btn', type: 'button', onclick: () => { stop(); idx = cfgs.length - 1; draw(); } }, 'Jump to end ⏭'),
      h('div', { class: 'field', style: 'margin-left:8px' }, h('label', { for: 'tm-speed' }, 'Delay (ms)'), h('input', { type: 'range', id: 'tm-speed', min: 30, max: 700, value: 160 }))),
    errBox,

/* ---------- Undecidability lab ---------- */
function viewUndec() {
  const root = h('div', { class: 'view' });
  root.append(h('section', { class: 'hero' }, h('div', { class: 'eyebrow' }, 'Unit 5 · undecidability and complexity'), h('h1', {}, 'Undecidability lab'),
    h('p', { class: 'lede' }, 'Solve a Post Correspondence Problem instance with the overhang method, then read the one-page proofs the papers ask for.')));
  const out = h('div', { class: 'lab' });
  const first = P.pcp[selIndex('pcp-preset')];
  const tileText = tl => tl.map(t => t[0] + ' ' + t[1]).join('\n');
  const ta = textArea('pcp', tileText(first.tiles), 5);
  const mp = h('input', { type: 'checkbox', id: 'pcp-m' });
  const sel = presetSelect('pcp-preset', P.pcp, p => { setTA('pcp', tileText(p.tiles)); run(); });
  const run = () => {
    out.replaceChildren();
    const tiles = S.texts.pcp.split(/\n/).map(l => l.trim().split(/\s+/)).filter(a => a.length === 2 && a[0]);
    if (!tiles.length) { out.append(err(new Error('Enter one tile per line as: top bottom'))); return; }
    out.append(table(['Tile', 'Top (list A)', 'Bottom (list B)'], tiles.map((t, i) => [i + 1, t[0], t[1]]), { monoCols: [1, 2] }));
    const r = F.solvePCP(tiles, { mpcp: mp.checked });
    if (r.found) {
      let T = '', B = ''; const rows = r.seq.map((i, k) => { T += tiles[i - 1][0]; B += tiles[i - 1][1]; return [k + 1, i, tiles[i - 1][0], tiles[i - 1][1], T, B]; });
      out.append(stage(mp.checked ? 'Solution that starts with tile 1 (MPCP)' : 'Solution found', h('p', {}, 'Sequence ', h('b', { class: 'mono' }, r.seq.join(', ')), ': both rows spell ', h('b', { class: 'mono' }, r.top), '.'), table(['Step', 'Tile', 'Top adds', 'Bottom adds', 'Top so far', 'Bottom so far'], rows, { monoCols: [2, 3, 4, 5] })));
    } else {
      const topLonger = tiles.every(t => t[0].length > t[1].length), botLonger = tiles.every(t => t[1].length > t[0].length);
      out.append(stage('No solution found', h('p', {}, topLonger ? 'Every top string is longer than its bottom string, so the top row always stays ahead and the two rows can never be equal. There is no solution.' : botLonger ? 'Every bottom string is longer than its top string, so the bottom row always stays ahead. There is no solution.' : 'The search tried every sequence whose overhang stays consistent' + (r.exhausted ? ' and ran out of options, so within the length limits there is no solution.' : ' within its limits. PCP is undecidable, so failing to find one does not prove none exists.'))));
    }
  };
  root.append(h('section', { class: 'card lab' }, h('h2', {}, 'PCP solver'),
    h('div', { class: 'toolbar' }, h('div', { class: 'field' }, h('label', { for: 'pcp-preset' }, 'Load from a paper'), sel)),
    h('div', { class: 'field' }, h('label', { for: 'ta-pcp' }, 'Tiles, one per line: top bottom'), ta),
    h('div', { class: 'toolbar' }, h('label', { class: 'check', for: 'pcp-m' }, mp, h('span', {}, 'MPCP: the sequence must start with tile 1')), h('button', { class: 'btn primary', type: 'button', onclick: run }, 'Solve')), out,
    h('p', { class: 'small muted' }, 'Two lists that I read from the scans (Nov 2025 and May 2025) may differ from your paper. Check the tiles before relying on the answer.')));
  run();
  root.append(h('section', {}, h('h2', {}, 'One-page proofs and definitions'), D.theory.filter(t => /Rice|Lₑ|Halting|PCP|Decidable|NP|variants|Pumping|regular sets|DPDA/.test(t.title)).map(t => h('details', {}, h('summary', {}, t.title), h('div', { class: 'body' }, t.body.map(p => h('p', {}, p)))))));
  return root;
}

/* ---------- Quiz ---------- */
function viewQuiz() {
  const root = h('div', { class: 'view' });
  const stats = store.get('quiz', {});
  root.append(h('section', { class: 'hero' }, h('div', { class: 'eyebrow' }, 'Part A · 4 marks per unit'), h('h1', {}, 'Part A drill'),
    h('p', { class: 'lede' }, D.quiz.length + ' real MCQs from the six papers, grouped by unit. Answers come with a one-line reason.')));
  const area = h('div', {});
  let filter = S.qUnit || 0;
  const start = (pool) => {
    const list = pool.slice().sort(() => Math.random() - 0.5); let i = 0, score = 0; const missed = [], per = {};
    const show = () => {
      area.replaceChildren();
      if (i >= list.length) {
        const rows = [1, 2, 3, 4, 5].filter(u => per[u]).map(u => h('div', { class: 'r' }, h('span', {}, 'Unit ' + u), h('div', { class: 'bar' }, h('i', { style: 'width:' + Math.round(100 * per[u][0] / per[u][1]) + '%' })), h('span', {}, per[u][0] + '/' + per[u][1])));
        area.append(h('div', { class: 'card qbox' }, h('h2', {}, 'Score ' + score + ' of ' + list.length), h('div', { class: 'meter' }, rows),
          h('div', { class: 'row' }, missed.length ? h('button', { class: 'btn primary', type: 'button', onclick: () => start(missed) }, 'Retry the ' + missed.length + ' you missed') : null, h('button', { class: 'btn', type: 'button', onclick: () => start(filter ? D.quiz.filter(q => q.u === filter) : D.quiz) }, 'Start again'))));
        const st = store.get('quiz', {}); st.last = { score, total: list.length }; store.set('quiz', st); return;
      }
      const q = list[i]; let answered = false; let optsBox = null;
      const opts = q.o.map((t, k) => h('button', { class: 'opt', type: 'button', onclick: () => {
        if (answered) return; answered = true; per[q.u] = per[q.u] || [0, 0]; per[q.u][1]++;
        const right = k === q.a; if (right) { score++; per[q.u][0]++; } else missed.push(q);
        [...optsBox.children].forEach((b, j) => { b.disabled = true; if (j === q.a) b.classList.add('right'); else if (j === k) b.classList.add('wrong'); });
        area.querySelector('.fb').replaceChildren(h('p', {}, h('b', { class: right ? 'ok' : 'no' }, right ? 'Correct. ' : 'Not quite. '), q.why), h('button', { class: 'btn primary', type: 'button', onclick: () => { i++; show(); } }, i + 1 >= list.length ? 'See score' : 'Next question'));
      } }, t));
      optsBox = h('div', { class: 'opts' }, opts);
      area.append(h('div', { class: 'card qbox' }, h('div', { class: 'src' }, 'Question ' + (i + 1) + ' of ' + list.length + ' · Unit ' + q.u + ' · ' + q.src), h('h3', { style: 'font-family:var(--body);font-weight:500;font-size:17px;line-height:1.45' }, q.q), optsBox, h('div', { class: 'fb' })));
    };
    show();
  };
  root.append(h('div', { class: 'row' }, seg([[0, 'All units'], [1, 'Unit 1'], [2, 'Unit 2'], [3, 'Unit 3'], [4, 'Unit 4'], [5, 'Unit 5']], filter, v => { S.qUnit = v; filter = v; render(); }), h('button', { class: 'btn primary', type: 'button', onclick: () => start(filter ? D.quiz.filter(q => q.u === filter) : D.quiz) }, 'Start')));
  if (stats.last) root.append(h('p', { class: 'small muted' }, 'Last round on this device: ' + stats.last.score + ' of ' + stats.last.total + '.'));
  root.append(area);
  return root;
}

/* ---------- router ---------- */
const TABS = [['priority', 'Priorities', viewPriority], ['plan', 'Study plan', viewPlan], ['fa', 'Automata lab', viewFA], ['gram', 'Grammar lab', viewGram], ['pda', 'PDA lab', viewPDA], ['tm', 'Turing lab', viewTM], ['undec', 'Undecidability', viewUndec], ['quiz', 'Part A quiz', viewQuiz]];
function current() { const id = (location.hash || '').slice(1); return TABS.find(t => t[0] === id) || TABS[0]; }
function render() {
  if (timer) { clearInterval(timer); timer = null; }
  const [id, , fn] = current();
  $('#tabs').replaceChildren(...TABS.map(t => h('a', { href: '#' + t[0], 'aria-current': t[0] === id ? 'page' : null }, t[1])));
  const main = $('#view'); main.replaceChildren(fn());
  const a = $('#tabs a[aria-current]'); if (a && a.scrollIntoView) a.scrollIntoView({ inline: 'center', block: 'nearest' });
}
let last = null;
window.addEventListener('hashchange', () => { if (last !== location.hash) { last = location.hash; render(); window.scrollTo(0, 0); } });
last = location.hash; render();
})();
